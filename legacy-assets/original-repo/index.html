<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Abedemic</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="app">
		<header class="brand">ABEDEMIC</header>
		<div class="layout">
			<aside class="sidebar">
				<img class="profile-image" src="img/rimuru mascot.jpeg" alt="Rimuru mascot">
				<div class="profile-name">Profile</div>
				<button class="side-link" type="button">
					<img src="img/folder pic.jpeg" alt="">Setting
				</button>
				<button class="side-link" type="button">About Us</button>
				<div class="mascot-strip" aria-hidden="true">
					<img src="img/dino mascot.jpeg" alt="">
					<img src="img/elf mascot.jpeg" alt="">
				</div>
			</aside>
			<section class="content">
				<h1 class="welcome">Welcome to the Quest board, adventurer! Hope you enjoy your study time with us!</h1>
				<div class="dashboard">
					<a class="tile" href="#ask" aria-label="Ask our AI">
						<img class="ask-art" src="img/ask_our_ai-removebg-preview.png" alt="Ask our AI">
						<span class="tile-label ask-label">Ask Our AI!</span>
					</a>
					<a class="tile summary" href="#summary" aria-label="Summary">
						<img class="wide-art" src="img/sumarry_pic-removebg-preview.png" alt="Summary">
						<span class="tile-label summary-label">Summary</span>
					</a>
					<a class="tile quiz" href="#quiz" aria-label="Quiz time">
						<img class="wide-art" src="img/quiz_pic-removebg-preview.png" alt="Quiz time">
						<span class="tile-label quiz-label">Quiz Time!</span>
					</a>
					<a class="tile games" href="#games" aria-label="Games">
						<img class="wide-art" src="img/game_pic-removebg-preview.png" alt="Games">
						<span class="tile-label games-label">Games</span>
					</a>
				</div>
			</section>
		</div>
	</main>
</body>
</html>
